<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | Amazon Clone</title>
  <link rel="stylesheet" href="my-wishlist.css">
  <script src="my-wishlist.js" defer></script>
</head>
<body>
  <header class="wishlist-header">
    <a href="card.html" class="wishlist-logo">amazon<span>.in</span></a>
    <h1>My Wishlist ♡</h1>
    <a href="card.html" class="continue-shopping">Continue Shopping</a>
  </header>

  <main class="wishlist-container">
    <h2>Saved Products</h2>
    <p>Your favourite products in one place.</p>

    <section id="wishlist-products" class="wishlist-grid"></section>

    <section id="wishlist-empty" class="wishlist-empty" hidden>
      <h2>Your wishlist is empty ♡</h2>
      <p>Save products you love and find them here later.</p>
      <a href="card.html">Explore Products</a>
    </section>
  </main>
</body>
</html>
